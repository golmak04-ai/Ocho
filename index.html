<title>Ocho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a toy-shelf of eight game boxes — a bold numeral masthead, today's progress strip, filter chips, then a two-column grid of boxes whose lids carry each game's own art. */
:root{
  --bg:#efeee9; --shelf:#e4e2db; --card:#ffffff; --ink:#15161a; --muted:#5f6068; --line:#d6d4cc; --accent:#ff5a36; --accent-ink:#ffffff; --done:#11845b;
  --display:"Gabarito", "Arial Black", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121317; --shelf:#1a1b20; --card:#1e1f25; --ink:#f1f0ec; --muted:#9c9da6; --line:#2d2e36; --accent:#ff7350; --accent-ink:#121317; --done:#3fd197; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --shelf:#1a1b20; --card:#1e1f25; --ink:#f1f0ec; --muted:#9c9da6; --line:#2d2e36; --accent:#ff7350; --accent-ink:#121317; --done:#3fd197; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:980px;margin:0 auto;padding-block:22px 56px;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.mast{display:flex;flex-direction:column;gap:6px;min-width:0}
h1{font-family:var(--display);font-weight:900;font-size:clamp(64px,18vw,128px);line-height:.8;letter-spacing:-.05em;margin:0;display:flex;align-items:flex-end;gap:.06em}
h1 .o{display:inline-grid;place-items:center;width:.82em;height:.82em;border-radius:50%;background:conic-gradient(#2440b8 0 12.5%,#13845f 0 25%,#d7262b 0 37.5%,#f0a07a 0 50%,#7a5338 0 62.5%,#164584 0 75%,#1f6b4f 0 87.5%,#ffd84a 0);position:relative;transform:translateY(-.02em)}
h1 .o::after{content:"";width:46%;height:46%;border-radius:50%;background:var(--bg)}
.tag{font-family:var(--display);font-weight:700;font-size:clamp(18px,4.4vw,24px);margin:0;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);max-width:46ch}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}

.today{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 18px}
.today b{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.today .lbl{font-size:13px;color:var(--muted);line-height:1.3}
.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;min-width:0}
.slots i{height:12px;border-radius:6px;background:var(--shelf);box-shadow:inset 0 0 0 1.5px var(--line)}
.slots i.part{background:repeating-linear-gradient(45deg,var(--sc) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1.5px var(--sc)}
.slots i.done{background:var(--sc);box-shadow:none}
.surprise{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;white-space:nowrap}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.box{position:relative;display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;text-align:left;padding:0;transition:transform .18s ease,box-shadow .18s ease;min-width:0}
.box:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 14px 30px rgba(0,0,0,.14)}
.box:nth-child(even):hover{transform:translateY(-4px) rotate(.4deg)}
.lid{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden}
.lid svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.num{position:absolute;left:14px;top:12px;font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(4px)}
.status{position:absolute;right:12px;top:12px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:#15161a;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.status.done{background:#11845b;color:#fff}
.status.part{background:#ffd84a;color:#15161a}
.info{display:flex;flex-direction:column;gap:6px;padding:14px 18px 16px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.name{font-family:var(--display);font-weight:900;font-size:28px;line-height:1;letter-spacing:-.02em;margin:0}
.kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.desc{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.play{margin-top:6px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.play .arrow{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);transition:transform .18s}
.box:hover .play .arrow{transform:translateX(4px)}
footer{color:var(--muted);font-size:14px;text-align:center}

.stage{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#000;animation:open .28s ease-out}
@keyframes open{from{opacity:0;transform:scale(.98)}}
.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:#0d0e11;color:#f1f0ec}
.bar .back{border:0;background:#25262d;color:#f1f0ec;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.bar .title{font-family:var(--display);font-weight:900;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .dots{display:flex;gap:4px}
.bar .dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:#3a3b44}
.bar .dots button[aria-current="true"]{background:#f1f0ec}
.stage iframe{flex:1;width:100%;border:0;background:#fff}
@media (prefers-reduced-motion: reduce){.box,.play .arrow,.stage{transition:none;animation:none}}
</style>

<div class="wrap" id="hub">
  <header>
    <div class="mast">
      <h1 aria-label="Ocho">OCH<span class="o" aria-hidden="true"></span></h1>
      <p class="tag" id="tag"></p>
      <p class="sub" id="sub"></p>
    </div>
    <div class="side">
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div>
      <span class="day" id="day"></span>
    </div>
  </header>

  <section class="today" aria-live="polite">
    <div><b id="count">0/8</b><div class="lbl" id="countlbl"></div></div>
    <div class="slots" id="slots"></div>
    <button class="surprise" id="surprise" type="button"></button>
  </section>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</div>

<div class="stage" id="stage" hidden>
  <div class="bar">
    <button class="back" id="back" type="button"></button>
    <span class="title" id="stitle"></span>

  </div>

const $=id=>document.getElementById(id);
let LANG=(()=>{try{return localStorage.getItem("ocho-lang")}catch(e){return null}})()||((navigator.language||"en").toLowerCase().startsWith("es")?"es":"en");
let FILTER="all";
function dayNo(d=new Date()){const s=new Date(2026,9,12);const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.round((t-s)/864e5)+1}
const today=Math.max(1,dayNo());
function status(g){
  try{const s=JSON.parse(localStorage.getItem(g.key)||"null");if(!s)return"fresh";
    if(g.id==="murmur")return s.days&&s.days[today]?"done":"fresh";
    if(g.id==="overlap"){const b=["en","es"].map(l=>s[l]&&s[l].days&&s[l].days[today]).filter(Boolean);if(b.some(x=>x.done))return"done";return b.length?"part":"fresh"}
    const d=s.days&&s.days[today];if(!d)return"fresh";return d.done?"done":"part";
  }catch(e){return"fresh"}
}
function render(){
  const t=TX[LANG];document.documentElement.lang=LANG;
  $("tag").textContent=t.tag;$("sub").textContent=t.sub;$("day").textContent=t.day(today);$("countlbl").innerHTML=t.countlbl;$("surprise").textContent="🎲 "+t.surprise;$("foot").textContent=t.foot;$("back").textContent=t.back;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  const st=GAMES.map(status);
  $("count").textContent=`${st.filter(s=>s==="done").length}/8`;
  $("slots").replaceChildren(...GAMES.map((g,i)=>{const e=document.createElement("i");e.style.setProperty("--sc",g.color);if(st[i]!=="fresh")e.className=st[i];e.title=g.name;return e}));
  $("filters").replaceChildren(...Object.keys(KINDS).filter(k=>k==="all"||GAMES.some(g=>g.kind===k)).map(k=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=KINDS[k][LANG];b.setAttribute("aria-pressed",FILTER===k);b.onclick=()=>{FILTER=k;render()};return b}));
  $("grid").replaceChildren(...GAMES.map((g,i)=>({g,i})).filter(({g})=>FILTER==="all"||g.kind===FILTER).map(({g,i})=>{
    const b=document.createElement("button");b.type="button";b.className="box";b.setAttribute("aria-label",`${t.play} ${g.name}`);
    const s=st[i];
    b.innerHTML=`<div class="lid">${ART[g.id]}<span class="num">${String(i+1).padStart(2,"0")}</span><span class="status ${s==="fresh"?"":s}">${s==="done"?"✓ "+t.done:s==="part"?t.part:t.fresh}</span></div>
      <div class="info"><div class="row"><h2 class="name">${g.name}</h2><span class="kind">${KINDS[g.kind][LANG]}</span></div><p class="desc">${g[LANG]}</p><span class="play"><span class="arrow">→</span>${t.play}</span></div>`;
    b.onclick=()=>open(g.id);return b}));
  $("dots").replaceChildren(...GAMES.map(g=>{const d=document.createElement("button");d.type="button";d.title=g.name;d.setAttribute("aria-label",g.name);d.dataset.id=g.id;d.onclick=()=>open(g.id);return d}));
}
let current=null;
function open(id){if(location.hash!=="#"+id)location.hash=id;else show(id)}
function show(id){
  const g=GAMES.find(x=>x.id===id);if(!g){hide();return}
  current=id;$("stage").hidden=false;$("stitle").textContent=g.name;$("frame").title=g.name;
  const f=$("frame");if(f.dataset.id!==id){f.dataset.id=id;f.srcdoc=gsrc(id)}
  document.querySelectorAll("#dots button").forEach(d=>d.setAttribute("aria-current",d.dataset.id===id));
  document.body.style.overflow="hidden";
}
function hide(){current=null;$("stage").hidden=true;const fr=$("frame");fr.dataset.id="";fr.srcdoc="";document.body.style.overflow="";render()}
function route(){const id=location.hash.slice(1);if(id&&GAMES.some(g=>g.id===id))show(id);else if(current)hide()}
addEventListener("hashchange",route);
$("back").onclick=()=>{if(location.hash){history.replaceState(null,"",location.pathname+location.search);hide()}else hide()};
addEventListener("keydown",e=>{if(e.key==="Escape"&&current)$("back").click()});
$("surprise").onclick=()=>{const st=GAMES.map(status);const pool=GAMES.filter((g,i)=>st[i]!=="done");const list=pool.length?pool:GAMES;open(list[Math.floor(Math.random()*list.length)].id)};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem("ocho-lang",LANG)}catch(e){}render()});
addEventListener("focus",()=>{if(!current)render()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!current)render()});
render();route();
</script>
